<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#FAF5EE">
  <title>Page Not Found | Ridwaan Mobile Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    main{max-width:560px;padding:44px 28px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
    .error-code{display:block;margin-bottom:12px;color:var(--primary);font-weight:800;letter-spacing:.12em}
    h1{margin:0 0 14px;font-size:clamp(2rem,8vw,3.5rem);line-height:1.08}
    p{margin:0 0 26px;color:var(--ink-soft)}
  </style>
</head>
<body>
  <main>
    <span class="error-code">404 ERROR</span>
    <h1>This store page could not be found.</h1>
    <p>Return to the smartphone shopping demo to continue browsing products.</p>
    <a class="btn btn-primary" href="/">Return to Ridwaan Mobile Store</a>
  </main>
</body>
</html>
